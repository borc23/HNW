[project]
name = "housing-netherlands"
version = "0.1.9"
description = "Personal housing dashboard for the Dutch rental market."
readme = "README.md"
authors = [
    { name = "Bor Cerne", email = "borc23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.10.0",
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "curl-cffi>=0.11",
    "fastapi==0.162.0",
    "geoalchemy2>=0.21.0",
    "jinja2==3.1.6",
    "litellm==1.106.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyhuurwoningen>=1.0.1",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
housing-netherlands = "housing_netherlands:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.5",
    "pre-commit>=4.7.0",
    "pyright[nodejs]==1.1.408",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-aiobotocore[s3]>=3.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised inside litellm's own TypedDicts when pydantic builds their schema; not our code.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
    # Raised inside arq's Worker.close() (redis-py deprecation); not our code.
    "ignore:Call to deprecated close:DeprecationWarning",
    # starlette.testclient notice (prefers httpx2); test-only, not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: needs the Docker Compose stack (postgres, redis, seaweedfs); deselect with -m 'not integration'",
    "live: calls a real third-party website; skipped unless RUN_LIVE_TESTS=1 (never on CI)",
]

[tool.coverage.run]
source = ["housing_netherlands"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
