name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=term

  integration:
    # Postgres, Redis and SeaweedFS from docker-compose.yml. No Ollama on CI: the one live-LLM
    # test skips itself; everything else fakes the LLM and the listing site. Tests marked `live`
    # (real websites) are skipped unless RUN_LIVE_TESTS=1, which CI never sets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Start services
        # The tests create their own buckets/databases (see tests/integration/conftest.py).
        run: |
          cp .env.example .env
          docker compose up -d --build --wait postgres redis seaweedfs

      - name: Integration tests
        # CI=true (set by GitHub) makes a missing service fail the run instead of skipping.
        run: uv run pytest -m integration

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
